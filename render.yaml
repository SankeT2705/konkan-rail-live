services:
  # ── Backend Web Service ───────────────────────────────────────────────────────
  - type: web
    name: konkan-rail-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: SCRAPE_INTERVAL_MS
        value: 30000

  # ── Frontend Static Site ──────────────────────────────────────────────────────
  - type: web
    name: konkan-rail-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: konkan-rail-backend
          property: host
